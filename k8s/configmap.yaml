apiVersion: v1
kind: ConfigMap
metadata:
  name: john-log-config
  namespace: john-log
data:
  POSTGRES_DB: "john_log"
  PORT: "8080"
  RETENTION_DAYS: "30"
  PARTITION_LOOKAHEAD_DAYS: "7"
  RETENTION_CRON: "10 0 * * *"
  # project:region:instance — from `gcloud sql instances describe`
  INSTANCE_CONNECTION_NAME: "john-log:us-central1:john-log-db"
