apiVersion: apps/v1
kind: Deployment
metadata:
  name: john-log-app
  namespace: john-log
  labels:
    app: john-log
spec:
  replicas: 2
  selector:
    matchLabels:
      app: john-log
  template:
    metadata:
      labels:
        app: john-log
    spec:
      containers:
        - name: app
          image: us-central1-docker.pkg.dev/john-log/john-log/app:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: john-log-config
          env:
            - name: DB_CONNECTION
              valueFrom:
                secretKeyRef:
                  name: john-log-db-secret
                  key: DB_CONNECTION
          # Readiness: /health reads a cached "migrations done" flag and only
          # returns 200 once it's set, so this naturally waits out the
          # cloud-sql-proxy sidecar coming up before traffic is routed here.
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          # Liveness: /live never touches the DB, so a slow migration/DB
          # connection can't make kubelet think the process is hung and
          # restart it in a loop.
          livenessProbe:
            httpGet:
              path: /live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.0
          args:
            - "--structured-logs"
            - "--port=5432"
            - "$(INSTANCE_CONNECTION_NAME)"
          env:
            - name: INSTANCE_CONNECTION_NAME
              valueFrom:
                configMapKeyRef:
                  name: john-log-config
                  key: INSTANCE_CONNECTION_NAME
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /secrets/cloudsql/key.json
          volumeMounts:
            - name: cloudsql-sa-key
              mountPath: /secrets/cloudsql
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

      volumes:
        - name: cloudsql-sa-key
          secret:
            secretName: cloudsql-sa-key
