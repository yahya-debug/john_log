# Template only — do NOT commit the filled-in version.
# Copy to secret.yaml, fill in real values, then:
#   kubectl apply -f k8s/secret.yaml
# (k8s/secret.yaml is gitignored.)
apiVersion: v1
kind: Secret
metadata:
  name: john-log-db-secret
  namespace: john-log
type: Opaque
stringData:
  # Cloud SQL proxy listens on 127.0.0.1:5432 inside the pod (sidecar shares
  # the pod's network namespace with the app container), so this always
  # connects through loopback regardless of the instance's real address.
  DB_CONNECTION: "postgres://REPLACE_USER:REPLACE_PASSWORD@127.0.0.1:5432/john_log"
