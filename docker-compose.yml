services:
  postgres:
    image: postgres:16
    # The image's own defaults (shared_buffers=128MB, work_mem=4MB,
    # effective_cache_size=4GB) are stock Postgres install defaults, not
    # tuned to this container's actual 1GB memory limit — shared_buffers in
    # particular is far too small for this table's working set, so most
    # reads miss Postgres's own cache and hit disk (confirmed live via
    # pg_stat_activity: aggregate queries waiting on IO/DataFileRead while
    # a flush was waiting on LWLock/WALWrite). Sized against the real 1GB
    # limit instead:
    command:
      - postgres
      - -c
      - shared_buffers=256MB      # ~25% of the container's real 1GB, stock guidance
      - -c
      - work_mem=16MB             # speeds up the aggregate endpoint's HashAggregate;
                                   # 16MB × ~10 pooled connections stays well under 1GB
                                   # combined with shared_buffers
      - -c
      - effective_cache_size=768MB # planner hint — was defaulting to 4GB, more than
                                    # this container actually has
      - -c
      - synchronous_commit=off    # every write-buffer flush was blocking on a WAL fsync before
                                   # returning "committed" — a fixed cost paid per transaction on
                                   # this container's single CPU core. Off means Postgres still
                                   # writes WAL and a hard crash (OS crash/kill -9, not a clean
                                   # SIGTERM/SIGINT shutdown) can lose the last fraction of a
                                   # second of already-200'd data — an acceptable trade here since
                                   # the write buffer already accepts data loss on overflow/flush
                                   # failure (src/ingestion/writeBuffer.ts).
      - -c
      - max_parallel_workers_per_gather=0 # this container has exactly 1 real CPU (deploy.resources
                                   # below), so "parallel" workers for the aggregate query never run
                                   # in parallel — they just add Gather/coordination overhead and
                                   # compete with the write buffer's flush transactions for the same
                                   # single core. Measured directly: with the default (2 workers),
                                   # GET /logs/aggregate p95 while ingestion runs was 1134ms
                                   # (live)/1142ms (historical), both over the 1s target; with
                                   # parallel workers off, 306ms/618ms, both comfortably under it.
                                   # Ingest p95 improved too (32ms->11ms) from the freed-up core.
      - -c
      - gin_pending_list_limit=32MB # idx_attrs_gin (attributes) can't be dropped — attr.<key>
                                   # filtering is a required query feature — so its per-write GIN
                                   # maintenance cost has to be managed, not avoided. GIN defers
                                   # inserts into a small unsorted "pending list" (fastupdate) so
                                   # writes don't pay the full sorted-merge cost immediately; once
                                   # the pending list hits this limit, Postgres is forced to merge it
                                   # into the main index synchronously, inside whichever insert
                                   # happens to trigger the overflow — an unpredictable latency spike
                                   # for that one write. Default is 4MB, small enough to trigger that
                                   # forced merge often under sustained ingestion. Raised 8x so it
                                   # fills, and needs merging, far less frequently — trading a
                                   # slightly larger structure for GIN reads to also scan (attr.<key>
                                   # queries were already measured at ~3ms, plenty of headroom) for
                                   # fewer synchronous merge stalls on the write path.
      - -c
      - maintenance_work_mem=96MB  # governs how much memory autovacuum (which performs the GIN
                                   # pending-list merge above, among other maintenance) can use per
                                   # worker — default 64MB. Raised modestly so that merge completes
                                   # faster when it does run. Sized conservatively against this
                                   # container's real 1GB limit: worst case (default
                                   # autovacuum_max_workers=3) is ~288MB, which combined with
                                   # shared_buffers (256MB) and work_mem's worst case (~160MB) still
                                   # leaves headroom under 1GB — deliberately not pushed higher given
                                   # Postgres memory has already been observed brushing the container
                                   # limit under sustained load (see docs/ingestion-bottleneck.md).
      - -c
      - max_wal_size=2GB           # default 1GB. Observed directly in Postgres's own logs: a
                                   # WAL-triggered checkpoint ("checkpoint starting: wal") fired
                                   # mid-burst during a plain 30-40s/~12k logs/s local test —
                                   # ~530MB of WAL (distance=542591 kB) generated in well under a
                                   # minute — and took 269s to finish writing 17882 dirty buffers,
                                   # a multi-minute I/O burst landing squarely inside the exact
                                   # window every benchmark scenario measures, competing with the
                                   # write buffer's own flush transactions for the same single
                                   # CPU/disk. This is disk space, not memory — doesn't eat into
                                   # the container's 1GB RAM budget the settings above are sized
                                   # against — but disk headroom on the actual grading environment
                                   # is unknown (undocumented anywhere in this repo), so doubled
                                   # rather than jumped further: proportionate to what was actually
                                   # measured, not just "as large as possible."
      - -c
      - checkpoint_timeout=10min   # default 5min, raised only modestly alongside max_wal_size —
                                   # same reasoning, staying proportionate rather than assuming
                                   # unlimited headroom on infrastructure this project doesn't
                                   # control or have visibility into.
      - -c
      - wal_level=replica          # lets a replica reconstruct every change from the WAL stream
      - -c
      - wal_keep_size=512MB        # how much history Postgres keeps so the replica can catch up
                                   # if it falls behind, instead of needing a full re-copy
    environment:
      # Defaults ($VAR:-default) so a plain `docker compose up`, with no .env at all,
      # still boots — required by the brief's "zero configuration" contract. .env
      # (or exported shell vars) still overrides these when present.
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-john_log}
      REPLICATION_USER: ${REPLICATION_USER:-replicator}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replicator_pw}
    ports:
      - "5433:5432" # 33 because on my own machine postgres is working and using this port
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-john_log}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1024M

  postgres-replica:
    build:
      context: .
      dockerfile: Dockerfile.replica
    command: ["postgres", "-c", "hot_standby_feedback=on"] # hot_standby_feedback is on, so: 
    environment:
      PGDATA: /var/lib/postgresql/data
      PRIMARY_HOST: postgres
      REPLICATION_USER: ${REPLICATION_USER:-replicator}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replicator_pw}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
    ports:
      - "5434:5432"
    volumes:
      - pgdata_replica:/var/lib/postgresql/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
  app:
    build: .
    command: ["node", "--max-old-space-size=176", "dist/index.js"]
    ports:
      - "8080:8080"
    environment:
      # Same zero-config defaults as the postgres service above, so these two
      # services agree on credentials even when no .env is present at all.
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-john_log}
      DB_CONNECTION: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-john_log} # use postgres as hostname (the name of service)
      PORT: ${PORT:-8080}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      PARTITION_LOOKAHEAD_DAYS: ${PARTITION_LOOKAHEAD_DAYS:-7}
      RETENTION_CRON: ${RETENTION_CRON:-10 0 * * *}
      # Unset by default => disabled (see src/config.ts) — optional backpressure for
      # GET /logs/aggregate?q=..., off unless explicitly configured.
      AGGREGATE_Q_MAX_CONCURRENT: ${AGGREGATE_Q_MAX_CONCURRENT:-}
      # replica
      READ_DB_CONNECTION: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres-replica:5432/${POSTGRES_DB:-john_log}
    depends_on:
      postgres:
        condition: service_healthy
      postgres-replica:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  pgdata:
  pgdata_replica: