name: cd

# Runs after `ci` finishes on main, and only deploys if ci actually passed —
# this workflow is triggered separately from ci.yml (workflow_run instead of
# a shared `needs:`), so gating on conclusion is what stops an untested build
# from reaching the cluster.
on:
  workflow_run:
    workflows: ["ci"]
    branches: [main]
    types: [completed]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  REPO: john-log
  IMAGE_NAME: app
  CLUSTER: john-log-cluster
  NAMESPACE: john-log

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: configure docker auth for artifact registry
        run: gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      - name: build and push image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/${IMAGE_NAME}:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: get gke credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER }}
          location: ${{ env.REGION }}

      - name: apply manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: deploy new image
        run: |
          kubectl set image deployment/john-log-app app="$IMAGE" -n "$NAMESPACE"
          kubectl rollout status deployment/john-log-app -n "$NAMESPACE" --timeout=180s
