name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # npm test runs both tests/unit and tests/integration — the latter needs
    # a real Postgres to connect to, hence the service container below.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: john_log
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_CONNECTION: postgres://postgres:postgres@localhost:5432/john_log
      POSTGRES_DB: john_log
      RETENTION_DAYS: '30'
      PARTITION_LOOKAHEAD_DAYS: '7'
      RETENTION_CRON: '10 0 * * *'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run db:migrate:app
      - run: npm test

  docker-smoke-test:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: create .env from example
        run: cp .env.example .env
      - name: start services
        run: docker compose up -d --build
      - name: wait for health check
        run: |
          for i in {1..30}; do
            if curl -sg http://localhost:8080/health; then
              echo "service is healthy"
              exit 0
            fi
            echo "waiting for service"
            sleep 2
          done
          echo "sevice never became healthy"
          docker compose logs
          exit 1
      - name: smoke test ingestion
        run: |
          curl -sf -X POST http://localhost:8080/logs \
            -H "Content-Type: application/json" \
            -d '{"logs":[{"timestamp":"2026-07-28T00:00:00.000Z","level":"info","service":"ci","message":"smoke test"}]}'
      - name: smoke test query (POST then GET, confirms the read path actually works)
        run: |
          for i in {1..15}; do
            body=$(curl -sf "http://localhost:8080/logs?service=ci")
            count=$(echo "$body" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).logs.length))")
            if [ "$count" -gt 0 ]; then
              echo "found $count log(s) via GET /logs — read path works"
              exit 0
            fi
            sleep 2
          done
          echo "GET /logs never returned the entry POSTed above — read path broken"
          docker compose logs
          exit 1
      - name: tear down
        if: always()
        run: docker compose down -v
